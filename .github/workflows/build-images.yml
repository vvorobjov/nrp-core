name: Build & push runtime images

# Builds the nrp-core *runtime* images (source compiled on top of the
# matching *-env build environment) and pushes them to public Docker
# Hub. Two variants in the first iteration:
#
#   nrp-vanilla       base-env -> nrp-vanilla        (vanilla.cmake)
#   nrp-nest-gazebo   base-env -> gazebo-env ->
#                     nest-gazebo-env -> nrp-nest-gazebo (nest-gazebo.cmake)
#
# CI runs on GitHub Actions (public repo = free unlimited standard-runner
# minutes + 6 h/job, vs Bitbucket's metered minutes + 2 h/step). Bitbucket
# stays the canonical repo for PRs + tickets; development/master are synced
# to GitHub (and GitLab), and that synced push is what fires this workflow.
#
# Naming (EBR2-91): clean names, no -ubuntu20 suffix (Ubuntu 20.04 dropped
# in EBR2-81): hbpneurorobotics/nrp-vanilla, hbpneurorobotics/nrp-nest-gazebo.
#
# Tag policy:
#   pull_request        -> build only, NO push (validate)
#   push to development  -> :latest + :development + :sha-<short>
#   push to master       -> :stable + :master + :sha-<short>
#
# Repo/org secrets required (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USER   = hbpneurorobotics
#   DOCKERHUB_TOKEN  = Docker Hub PAT with write scope

on:
  workflow_dispatch:
  push:
    branches: [development, master]
  pull_request:
    # Docs-only PRs don't change the runtime images; skip the multi-hour
    # build for them. Mirrors the doc/markdown paths.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  # NB: the `matrix` context is not available at workflow level, only
  # inside jobs — referencing it here makes the whole file invalid.
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Read the prebuilt *-env layers from GHCR (build-env-images.yml pushes them).
  packages: read

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        service: [nrp-vanilla, nrp-nest-gazebo]
    env:
      NRP_DOCKER_REGISTRY: ${{ secrets.DOCKERHUB_USER }}
    steps:
      - name: Reclaim disk space
        # The nest-gazebo chain is multi-GB (NEST 3.9 from source +
        # Gazebo 11 + ROS 2). Drop the runner's unused toolchains first.
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          docker image prune -af || true
          df -h /

      - name: Add swap
        # The nest-gazebo runtime compile links Gazebo/ROS-typesupport
        # C++ units that each peak >8 GB; .ci/20-build.sh runs -j4 on a
        # 16 GB runner, which OOM-kills the link (exit 143 / SIGTERM at
        # ~94%). A large swapfile (disk is 100+ GB free) lets the peak
        # spill instead of being killed. Host swap is used automatically
        # by the `docker build` compiler processes — no Dockerfile or
        # build-script change needed.
        run: |
          set -euxo pipefail
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 30G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=30720
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute image tag
        # Share NRP_CORE_TAG across the reuse/build/push steps so the
        # tag the env layers are seeded under matches what build_service
        # resolves and what the publish step pushes.
        run: echo "NRP_CORE_TAG=sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Log in to GHCR (read prebuilt env layers)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse prebuilt env layers from GHCR
        # Pull the *-env layers that build-env-images.yml already
        # compiled + pushed and tag them under the local (Docker Hub)
        # registry name that docker-compose.yaml resolves. build_service()
        # (guarded by NRP_REUSE_EXISTING_IMAGES in the next step) then
        # skips the multi-hour NEST/Gazebo/ROS env recompile. Any layer
        # missing from GHCR is left to be rebuilt from source.
        env:
          GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euxo pipefail
          if [[ -z "${NRP_DOCKER_REGISTRY}" ]]; then
            echo "NRP_DOCKER_REGISTRY unset (e.g. fork PR without secrets); skipping env reuse — layers will be rebuilt."
            exit 0
          fi
          case "${{ matrix.service }}" in
            nrp-vanilla)     ENV_LAYERS="base-env" ;;
            nrp-nest-gazebo) ENV_LAYERS="base-env gazebo-env nest-gazebo-env" ;;
            *)               ENV_LAYERS="" ;;
          esac
          for layer in $ENV_LAYERS; do
            src="${GHCR_REGISTRY}/${layer}:latest"
            dst="${NRP_DOCKER_REGISTRY}/${layer}:${NRP_CORE_TAG}"
            if docker pull "$src"; then
              docker tag "$src" "$dst"
              echo "Seeded ${dst} from ${src}"
            else
              echo "WARNING: ${src} not found in GHCR; ${layer} will be built from source."
            fi
          done

      - name: Build ${{ matrix.service }}
        env:
          # Reuse the env layers seeded above instead of recompiling them.
          NRP_REUSE_EXISTING_IMAGES: "1"
        run: |
          set -euxo pipefail
          echo "Building ${NRP_DOCKER_REGISTRY}/${{ matrix.service }}:${NRP_CORE_TAG}"
          bash build_nrp_core_image.sh "${{ matrix.service }}"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag & push channel tags
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          SHORT="sha-${GITHUB_SHA::12}"
          IMAGE="${NRP_DOCKER_REGISTRY}/${{ matrix.service }}"
          case "${GITHUB_REF_NAME}" in
            development) CHANNELS="latest development" ;;
            master)      CHANNELS="stable master" ;;
            *) echo "Ref '${GITHUB_REF_NAME}' is not a publish branch; skipping push."; exit 0 ;;
          esac
          docker push "${IMAGE}:${SHORT}"
          for c in $CHANNELS; do
            docker tag "${IMAGE}:${SHORT}" "${IMAGE}:${c}"
            docker push "${IMAGE}:${c}"
          done

      - name: PR build summary
        if: github.event_name == 'pull_request'
        run: echo "PR build of ${NRP_DOCKER_REGISTRY}/${{ matrix.service }} succeeded; not pushing."
