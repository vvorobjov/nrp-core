name: CI

# The container image used below is built and pushed by the
# 'build-ci-image.yml' workflow.  On pushes to master/development that touch
# the Dockerfiles, the image is rebuilt first and this workflow is triggered
# automatically via workflow_run once the build completes.  For all other
# pushes and pull requests the image is pulled directly from Docker Hub.
#
# Image name: hbpneurorobotics/nrp-nest-gazebo-ubuntu20-env:latest
# (corresponds to the 'nrp-nest-gazebo-env' service in docker-compose.yaml)

on:
  # Run directly for pull requests (image already exists on Docker Hub).
  pull_request:
  # Run after the image-build workflow completes on master/development pushes,
  # so the fresh image is always available before we try to pull it.
  workflow_run:
    workflows: ["Build and Push CI Container Image"]
    types:
      - completed
    branches:
      - master
      - development

jobs:
  build-and-test:
    # When triggered by workflow_run, only proceed if the upstream build succeeded.
    if: ${{ github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    container:
      # Override by setting the NRP_CI_CONTAINER_IMAGE repository variable.
      image: ${{ vars.NRP_CI_CONTAINER_IMAGE || 'hbpneurorobotics/nrp-nest-gazebo-ubuntu20-env:latest' }}

    env:
      BUILD_DIR: build
      SMOKE_TEST_PATTERN: EngineScript|ServerCallbacks|PyServerGrpcCallbacks|EventLoopPython
      CMAKE_CACHE_FILE: .ci/cmake_cache/nest-gazebo.cmake
      NRP_INSTALL_DIR: ${{ github.workspace }}/.nrp-install
      NRP_DEPS_INSTALL_DIR: ${{ github.workspace }}/.nrp-deps-install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare build
        shell: bash
        run: bash .ci/11-prepare-build.sh

      - name: Build
        shell: bash
        run: bash .ci/20-build.sh

      - name: Run full test script
        shell: bash
        run: bash .ci/30-run-tests.sh

      # Run a strict smoke subset while the full suite is being stabilized.
      - name: Run smoke test subset
        shell: bash
        run: |
          ctest --test-dir "${BUILD_DIR}" --output-on-failure \
            -R "${SMOKE_TEST_PATTERN}"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ env.BUILD_DIR }}/Testing/**/*.xml
            ${{ env.BUILD_DIR }}/xml/**/*.xml
            ${{ env.BUILD_DIR }}/gcovr.xml
          if-no-files-found: ignore
