name: CI

on:
  push:
    branches:
      - master
      - development
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    container:
      image: hbpneurorobotics/nrp-xpra-gazebo-nest-ubuntu20-env:latest

    env:
      CMAKE_CACHE_FILE: .ci/cmake_cache/nest-gazebo.cmake
      NRP_INSTALL_DIR: ${{ github.workspace }}/.nrp-install
      NRP_DEPS_INSTALL_DIR: ${{ github.workspace }}/.nrp-deps-install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare build
        shell: bash
        run: bash .ci/11-prepare-build.sh

      - name: Build
        shell: bash
        run: bash .ci/20-build.sh

      - name: Run tests
        shell: bash
        run: bash .ci/30-run-tests.sh

      - name: Ensure at least one test passed
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          test_files = sorted(glob.glob('build/Testing/*/Test.xml'))
          if not test_files:
              print('No CTest XML reports found')
              sys.exit(1)

          passed = 0
          for path in test_files:
              root = ET.parse(path).getroot()
              passed += len(root.findall(".//Test[@Status='passed']"))

          print(f'Passed tests found: {passed}')
          sys.exit(0 if passed > 0 else 1)
          PY

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/Testing/**/*.xml
            build/xml/**/*.xml
            build/gcovr.xml
          if-no-files-found: ignore
