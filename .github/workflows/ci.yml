name: CI

on:
  push:
    branches:
      - master
      - development
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    container:
      image: ${{ vars.NRP_CI_CONTAINER_IMAGE || 'hbpneurorobotics/nrp-xpra-gazebo-nest-ubuntu20-env:latest' }}

    env:
      BUILD_DIR: build
      SMOKE_TEST_PATTERN: EngineScript|ServerCallbacks|PyServerGrpcCallbacks|EventLoopPython
      CMAKE_CACHE_FILE: .ci/cmake_cache/nest-gazebo.cmake
      NRP_INSTALL_DIR: ${{ github.workspace }}/.nrp-install
      NRP_DEPS_INSTALL_DIR: ${{ github.workspace }}/.nrp-deps-install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare build
        shell: bash
        run: bash .ci/11-prepare-build.sh

      - name: Build
        shell: bash
        run: bash .ci/20-build.sh

      - name: Run full test script
        shell: bash
        run: bash .ci/30-run-tests.sh

      # Run a strict smoke subset while the full suite is being stabilized.
      - name: Run smoke test subset
        shell: bash
        run: |
          ctest --test-dir "${BUILD_DIR}" --output-on-failure \
            -R "${SMOKE_TEST_PATTERN}"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ env.BUILD_DIR }}/Testing/**/*.xml
            ${{ env.BUILD_DIR }}/xml/**/*.xml
            ${{ env.BUILD_DIR }}/gcovr.xml
          if-no-files-found: ignore
