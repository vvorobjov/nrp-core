                BASE_IMAGE: ${NRP_DOCKER_REGISTRY}/base-env:${NRP_CORE_TAG}
        image: ${NRP_DOCKER_REGISTRY}/opensim-env:${NRP_CORE_TAG}
        command: bash
        depends_on:
        - base-env


    tvb-opensim-env:
