version: '3.9'

# See the usage instructions in the README.md
#
# Single Ubuntu target: jammy (22.04) / Humble / Python 3.10.
# EBR2-81 dropped the parallel focal (20.04) chain.

services:

    base-env:
        build:
            context: .
            dockerfile: dockerfiles/base.Dockerfile
            args:
                BASE_IMAGE: ubuntu:jammy
        image: ${NRP_DOCKER_REGISTRY}/base-env:${NRP_CORE_TAG}
        command: bash


    nrp-vanilla-env:
        build:
            context: .
            dockerfile: dockerfiles/nrp-core.Dockerfile
            target: nrp-core-env
            args:
                BASE_IMAGE: ${NRP_DOCKER_REGISTRY}/base-env:${NRP_CORE_TAG}
                CMAKE_CACHE_FILE: .ci/cmake_cache/vanilla.cmake
                PYTHON_VERSION: "3.10"
        image: ${NRP_DOCKER_REGISTRY}/nrp-vanilla-env:${NRP_CORE_TAG}
        command: bash
        depends_on:
        - base-env


    gazebo-env:
        build:
            context: .
            dockerfile: dockerfiles/gazebo.Dockerfile
            args:
                BASE_IMAGE: ${NRP_DOCKER_REGISTRY}/base-env:${NRP_CORE_TAG}
                ROS_DISTRO: humble
        image: ${NRP_DOCKER_REGISTRY}/gazebo-env:${NRP_CORE_TAG}
        command: bash
        depends_on:
        - base-env


    xpra-gazebo-env:
        build:
            context: .
            dockerfile: dockerfiles/xpra.Dockerfile
            args:
                BASE_IMAGE: ${NRP_DOCKER_REGISTRY}/gazebo-env:${NRP_CORE_TAG}
        image: ${NRP_DOCKER_REGISTRY}/xpra-gazebo-env:${NRP_CORE_TAG}
        command: bash
        depends_on:
        - gazebo-env


    nest-gazebo-env:
        build:
            context: .
            dockerfile: dockerfiles/nest.Dockerfile
            args:
                BASE_IMAGE: ${NRP_DOCKER_REGISTRY}/gazebo-env:${NRP_CORE_TAG}
                PYTHON_VERSION: "3.10"
        image: ${NRP_DOCKER_REGISTRY}/nest-gazebo-env:${NRP_CORE_TAG}
        command: bash
        depends_on:
        - gazebo-env


    xpra-nest-gazebo-env:
        build:
            context: .
            dockerfile: dockerfiles/xpra.Dockerfile
            args:
                BASE_IMAGE: ${NRP_DOCKER_REGISTRY}/nest-gazebo-env:${NRP_CORE_TAG}
        image: ${NRP_DOCKER_REGISTRY}/xpra-nest-gazebo-env:${NRP_CORE_TAG}
        command: bash
        depends_on:
        - nest-gazebo-env


    nrp-xpra-nest-gazebo-env:
        build:
            context: .
            dockerfile: dockerfiles/nrp-core.Dockerfile
            target: nrp-core-env
            args:
                BASE_IMAGE: ${NRP_DOCKER_REGISTRY}/xpra-nest-gazebo-env:${NRP_CORE_TAG}
                PYTHON_VERSION: "3.10"
        image: ${NRP_DOCKER_REGISTRY}/nrp-xpra-nest-gazebo-env:${NRP_CORE_TAG}
        command: bash
        depends_on:
        - xpra-nest-gazebo-env


    nrp-nest-gazebo-env:
        build:
            context: .
            dockerfile: dockerfiles/nrp-core.Dockerfile
            target: nrp-core-env
            args:
                BASE_IMAGE: ${NRP_DOCKER_REGISTRY}/nest-gazebo-env:${NRP_CORE_TAG}
                PYTHON_VERSION: "3.10"
        image: ${NRP_DOCKER_REGISTRY}/nrp-nest-gazebo-env:${NRP_CORE_TAG}
        command: bash
        depends_on:
        - nest-gazebo-env


    opensim-env:
        build:
            context: .
            dockerfile: dockerfiles/opensim.Dockerfile
